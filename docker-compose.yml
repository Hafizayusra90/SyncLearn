version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: synclearn_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: synclearn_db
    volumes:
      - mongo_data:/data/db

  # Redis Message Queue Service
  redis:
    image: redis:alpine
    container_name: synclearn_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data: