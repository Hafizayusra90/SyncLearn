    <div id="root"></div>
    <script>
      window.global = window;
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      window.process.nextTick = window.process.nextTick || function(fn, ...args) {
        return setTimeout(() => fn(...args), 0);
      };
    </script>
